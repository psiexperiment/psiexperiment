name: Run tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: python -m pip install ruff import-linter
      - name: Run ruff
        run: ruff check src tests tools
      - name: Check package layering (.py)
        # import-linter imports the package it checks, and this job does
        # not install it.
        run: PYTHONPATH=src lint-imports
      - name: Check package layering (.enaml)
        run: python tools/check_enaml_layering.py

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # PySide6's wheels don't include these. The xcb ones are for Qt's X11
      # platform plugin, which the tests use under xvfb. sounddevice's Linux
      # wheel, unlike the Windows one, doesn't include PortAudio.
      - name: Install the libraries Qt and sounddevice need (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libportaudio2
      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 -e ".[test,zarr,soundcard]"
      - name: Run tests (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest --cov --cov-report=term-missing
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: pytest --cov --cov-report=term-missing
